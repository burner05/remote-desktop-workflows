name: WINDOWS RDP - 9ROUTER TUNNEL (BULLETPROOF FINAL)

on:
  workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Enable Windows RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
          Write-Host "RDP Enabled"

      - name: Set Password
        run: |
          $securePassword = ConvertTo-SecureString -AsPlainText "P@ssw0rd123!" -Force
          Set-LocalUser -Name "runneradmin" -Password $securePassword
          Write-Host "Password set"

      - name: Set Turkish Q Keyboard
        run: |
          $LangList = New-WinUserLanguageList tr-TR
          $LangList[0].InputMethodTips.Clear()
          $LangList[0].InputMethodTips.Add("041F:0000041F")
          Set-WinUserLanguageList -LanguageList $LangList -Force
          Set-WinSystemLocale -SystemLocale tr-TR
          Set-Culture -CultureInfo tr-TR
          Write-Host "Turkish Q keyboard set"

      - name: Install 9router and Bootstrap DB
        run: |
          npm install -g 9router
          Write-Host "9router baslatiliyor (DB bootstrap)..."
          Start-Process -FilePath "cmd.exe" -ArgumentList "/c", "set REQUIRE_API_KEY=false && 9router" -WindowStyle Hidden
          Start-Sleep -Seconds 30
          Write-Host "DB bootstrapped"

      - name: Stop 9router Before DB Edit
        run: |
          Get-Process -Name "node" -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-Process -Name "9router" -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-NetTCPConnection -LocalPort 20128 -ErrorAction SilentlyContinue | ForEach-Object { Stop-Process -Id $_.OwningProcess -Force -ErrorAction SilentlyContinue }
          Start-Sleep -Seconds 5
          Write-Host "9router stopped, port freed"

      - name: Create Python DB Patcher (NO SINGLE QUOTES - BULLETPROOF)
        run: |
          $lines = @(
              'import sqlite3, os, sys',
              '',
              'def find_db_files():',
              '    paths = []',
              '    home = os.path.expanduser("~")',
              '    appdata = os.environ.get("APPDATA", "")',
              '    localappdata = os.environ.get("LOCALAPPDATA", "")',
              '    programdata = os.environ.get("PROGRAMDATA", "")',
              '    for base in [home, appdata, localappdata, programdata]:',
              '        if not base:',
              '            continue',
              '        for folder in [".9router", "9router"]:',
              '            dir_path = os.path.join(base, folder)',
              '            if os.path.exists(dir_path):',
              '                print("Scanning: " + dir_path)',
              '                for root, dirs, files in os.walk(dir_path):',
              '                    for f in files:',
              '                        if f.endswith(".db") or f.endswith(".sqlite") or f.endswith(".sqlite3"):',
              '                            paths.append(os.path.join(root, f))',
              '    return paths',
              '',
              'def patch_db(path):',
              '    try:',
              '        with open(path, "rb") as fh:',
              '            header = fh.read(16)',
              '        if not header.startswith(b"SQLite format 3"):',
              '            return False',
              '        print("=== Patching: " + path + " ===")',
              '        conn = sqlite3.connect(path)',
              '        cur = conn.cursor()',
              '        cur.execute("SELECT name FROM sqlite_master WHERE type=?", ("table",))',
              '        tables = [t[0] for t in cur.fetchall()]',
              '        print("Tables: " + str(tables))',
              '        patched = False',
              '        for table in tables:',
              '            try:',
              '                cur.execute("PRAGMA table_info(" + table + ")")',
              '                cols = [c[1] for c in cur.fetchall()]',
              '                print("  " + table + " cols: " + str(cols))',
              '                for col in cols:',
              '                    cl = col.lower()',
              '                    if "require" in cl or ("api" in cl and "key" in cl):',
              '                        try:',
              '                            cur.execute("UPDATE " + table + " SET " + col + "=?", (0,))',
              '                            print("    Set " + col + " = 0")',
              '                            patched = True',
              '                        except:',
              '                            pass',
              '                        try:',
              '                            cur.execute("UPDATE " + table + " SET " + col + "=?", ("false",))',
              '                            print("    Set " + col + " = false")',
              '                            patched = True',
              '                        except:',
              '                            pass',
              '                key_col = None',
              '                val_col = None',
              '                for c in cols:',
              '                    cl = c.lower()',
              '                    if cl in ["key", "name", "setting", "option"]:',
              '                        key_col = c',
              '                    if cl in ["value", "data", "enabled", "val"]:',
              '                        val_col = c',
              '                if key_col and val_col:',
              '                    print("  Key-value pattern: " + key_col + " -> " + val_col)',
              '                    targets = ["requireapikey", "require_api_key", "requirelogin", "require_login", "api_auth", "auth_enabled", "auth_required"]',
              '                    for tk in targets:',
              '                        for v in ["false", "0", 0, "False", "FALSE", "off", "disabled"]:',
              '                            try:',
              '                                cur.execute("UPDATE " + table + " SET " + val_col + "=? WHERE LOWER(" + key_col + ")=?", (v, tk))',
              '                                if cur.rowcount > 0:',
              '                                    print("    Updated: " + tk + " -> " + str(v) + " (" + str(cur.rowcount) + " rows)")',
              '                                    patched = True',
              '                            except:',
              '                                pass',
              '            except Exception as e:',
              '                print("  Table error: " + str(e))',
              '        conn.commit()',
              '        conn.close()',
              '        return patched',
              '    except Exception as e:',
              '        print("DB error: " + str(e))',
              '        return False',
              '',
              'print("========================================")',
              'print("BULLETPROOF DB PATCH - 9router")',
              'print("========================================")',
              'files = find_db_files()',
              'print("Total DB files found: " + str(len(files)))',
              'for f in files:',
              '    print("  - " + f)',
              'patched_count = 0',
              'for f in files:',
              '    if patch_db(f):',
              '        patched_count += 1',
              'print("========================================")',
              'print("RESULT: " + str(patched_count) + " DBs patched")',
              'print("========================================")'
          )
          $lines | Set-Content -Path "update_config.py" -Encoding UTF8
          Write-Host "Python script created successfully"
          Write-Host "File size: $((Get-Item update_config.py).Length) bytes"

      - name: Run DB Patcher
        run: |
          python update_config.py
          Write-Host "DB patcher completed"

      - name: Create Loopback Proxy (Header Stripper)
        run: |
          $proxyLines = @(
              'const http = require("http");',
              'const server = http.createServer((req, res) => {',
              '  const h = { ...req.headers };',
              '  const strip = ["cf-connecting-ip","cf-ipcountry","cf-ray","cf-visitor","cf-worker","cf-colo","x-forwarded-for","x-forwarded-proto","x-forwarded-host","x-forwarded-server","x-forwarded-port","x-forwarded-scheme","x-real-ip","forwarded","true-client-ip","x-original-forwarded-for","x-client-ip","x-cluster-client-ip","via","x-request-id","cf-request-id","cf-cache-status","expect-ct","nel","report-to","server","alt-svc"];',
              '  for (const k of strip) delete h[k];',
              '  h["host"] = "localhost:20128";',
              '  h["origin"] = "http://localhost:20128";',
              '  h["referer"] = "http://localhost:20128/";',
              '  h["sec-fetch-site"] = "same-origin";',
              '  h["sec-fetch-mode"] = "cors";',
              '  h["sec-fetch-dest"] = "empty";',
              '  const opts = { hostname: "127.0.0.1", port: 20128, path: req.url, method: req.method, headers: h };',
              '  const p = http.request(opts, (pr) => {',
              '    res.writeHead(pr.statusCode, pr.headers);',
              '    pr.pipe(res, { end: true });',
              '  });',
              '  req.pipe(p, { end: true });',
              '  p.on("error", () => { res.writeHead(502); res.end("proxy error"); });',
              '});',
              'server.listen(20129, "127.0.0.1", () => console.log("PROXY_READY"));'
          )
          $proxyLines | Set-Content -Path "proxy.js" -Encoding UTF8
          Start-Process -FilePath "node" -ArgumentList "proxy.js" -WindowStyle Hidden
          Start-Sleep -Seconds 5
          Write-Host "Proxy started on port 20129"

      - name: Restart 9router (Patched DB)
        run: |
          Write-Host "9router restartediliyor (patched DB ile)..."
          Start-Process -FilePath "cmd.exe" -ArgumentList "/c", "set REQUIRE_API_KEY=false && 9router" -WindowStyle Hidden
          Start-Sleep -Seconds 30
          try {
            $r = Invoke-RestMethod -Uri "http://127.0.0.1:20128/api/health" -Method GET -TimeoutSec 5
            Write-Host "9router healthy"
          } catch {
            Write-Host "Health check failed but continuing"
          }
          try {
            $models = Invoke-RestMethod -Uri "http://127.0.0.1:20129/v1/models" -Method GET -TimeoutSec 10
            Write-Host "SUCCESS: Proxy -> 9router OK, models endpoint responding WITHOUT auth"
            Write-Host "Models count: $($models.data.Count)"
          } catch {
            Write-Host "Models test: $_"
          }

      - name: Create Cloudflare Tunnel
        run: |
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "cloudflared.exe"
          $outLog = "cf-out.log"
          $errLog = "cf-err.log"
          Start-Process -NoNewWindow -FilePath ".\cloudflared.exe" -ArgumentList "tunnel", "--url", "http://127.0.0.1:20129" -RedirectStandardOutput $outLog -RedirectStandardError $errLog
          $tunnelUrl = ""
          for ($i = 1; $i -le 60; $i++) {
            Start-Sleep -Seconds 3
            $content = ""
            if (Test-Path $outLog) { $content += Get-Content $outLog -Raw -ErrorAction SilentlyContinue }
            if (Test-Path $errLog) { $content += Get-Content $errLog -Raw -ErrorAction SilentlyContinue }
            if ($content -match "https://[a-zA-Z0-9-]+\.(trycloudflare\.com|cfargotunnel\.com)") {
              $tunnelUrl = $matches[0]
              break
            }
            Write-Host "Tunnel URL bekleniyor... ($i/60)"
          }
          if ($tunnelUrl) {
            Write-Host ""
            Write-Host "============================================"
            Write-Host "9ROUTER TUNNEL HAZIR (BULLETPROOF FINAL)"
            Write-Host "============================================"
            Write-Host "TUNNEL URL  : $tunnelUrl"
            Write-Host "9ROUTER API : $tunnelUrl/v1"
            Write-Host "API KEY     : Gerekli DEĞİL (DB patch + proxy bypass)"
            Write-Host "RDP USER    : runneradmin"
            Write-Host "RDP PASS    : P@ssw0rd123!"
            Write-Host "============================================"
            Write-Host "Dashboard: $tunnelUrl/dashboard"
          } else {
            Write-Host "Tunnel URL alinamadi!"
            if (Test-Path $errLog) { Get-Content $errLog }
            exit 1
          }
          while ($true) {
            Start-Sleep -Seconds 60
            Write-Host "Aktif - $(Get-Date -Format 'HH:mm:ss')"
          }
