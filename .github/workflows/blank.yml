name: WINDOWS RDP - 9ROUTER TUNNEL

on:
  workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Windows RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
          Write-Host "RDP Enabled"

      - name: Set Password
        run: |
          $securePassword = ConvertTo-SecureString -AsPlainText "P@ssw0rd123!" -Force
          Set-LocalUser -Name "runneradmin" -Password $securePassword
          Write-Host "Password set"

      - name: Set Turkish Q Keyboard
        run: |
          $LangList = New-WinUserLanguageList tr-TR
          $LangList[0].InputMethodTips.Clear()
          $LangList[0].InputMethodTips.Add("041F:0000041F")
          Set-WinUserLanguageList -LanguageList $LangList -Force
          Set-WinSystemLocale -SystemLocale tr-TR
          Set-Culture -CultureInfo tr-TR
          Write-Host "Turkish Q keyboard set"

      - name: Install 9router
        run: |
          npm install -g 9router
          Write-Host "9router installed"

      - name: Start 9router
        run: |
          Write-Host "9router baslatiliyor..."
          Start-Process -FilePath "cmd.exe" -ArgumentList "/c", "set REQUIRE_API_KEY=false && 9router" -WindowStyle Hidden
          Start-Sleep -Seconds 25
          try {
            Invoke-RestMethod -Uri "http://127.0.0.1:20128/api/health" -Method GET -TimeoutSec 5
            Write-Host "9router OK"
          } catch {
            Write-Host "9router health check basarisiz ama devam ediliyor..."
          }

      - name: Create Loopback Proxy
        run: |
          Write-Host "Loopback proxy olusturuluyor..."
          
          $proxyCode = "const http = require('http');"
          $proxyCode += "const server = http.createServer((req, res) => {"
          $proxyCode += "  const h = { ...req.headers };"
          $proxyCode += "  const removeHeaders = ['cf-connecting-ip', 'cf-ipcountry', 'cf-ray', 'cf-visitor', 'cf-worker', 'cf-colo', 'x-forwarded-for', 'x-forwarded-proto', 'x-forwarded-host', 'x-forwarded-server', 'x-forwarded-port', 'x-real-ip', 'forwarded', 'true-client-ip', 'x-original-forwarded-for', 'x-client-ip', 'x-cluster-client-ip', 'via'];"
          $proxyCode += "  for (const k of removeHeaders) { delete h[k]; }"
          $proxyCode += "  h['host'] = 'localhost:20128';"
          $proxyCode += "  h['origin'] = 'http://localhost:20128';"
          $proxyCode += "  h['referer'] = 'http://localhost:20128/';"
          $proxyCode += "  const opts = { hostname: '127.0.0.1', port: 20128, path: req.url, method: req.method, headers: h };"
          $proxyCode += "  const proxyReq = http.request(opts, (proxyRes) => {"
          $proxyCode += "    res.writeHead(proxyRes.statusCode, proxyRes.headers);"
          $proxyCode += "    proxyRes.pipe(res, { end: true });"
          $proxyCode += "  });"
          $proxyCode += "  req.pipe(proxyReq, { end: true });"
          $proxyCode += "  proxyReq.on('error', () => { res.writeHead(502); res.end('proxy error'); });"
          $proxyCode += "});"
          $proxyCode += "server.listen(20129, '127.0.0.1', () => { console.log('PROXY_READY'); });"
          
          Set-Content -Path "proxy.js" -Value $proxyCode -Encoding UTF8
          Start-Process -FilePath "node" -ArgumentList "proxy.js" -WindowStyle Hidden
          Start-Sleep -Seconds 5
          
          try {
            Invoke-RestMethod -Uri "http://127.0.0.1:20129/api/health" -Method GET -TimeoutSec 5
            Write-Host "Proxy OK"
          } catch {
            Write-Host "Proxy test hatasi: $_"
          }

      - name: Disable Require API Key via API
        run: |
          Write-Host "Require API Key ayari otomatik kapatiliyor..."
          
          $body = '{"requireApiKey": false}'
          $headers = @{"Content-Type"="application/json"}
          
          # Birkaç farklı endpoint dene
          $endpoints = @(
            "http://127.0.0.1:20129/api/settings",
            "http://127.0.0.1:20129/api/settings/endpoint",
            "http://127.0.0.1:20129/api/endpoint",
            "http://127.0.0.1:20129/api/config"
          )
          
          $success = $false
          foreach ($endpoint in $endpoints) {
            try {
              Write-Host "Deneniyor: $endpoint"
              $response = Invoke-RestMethod -Uri $endpoint -Method PUT -Body $body -Headers $headers -TimeoutSec 10
              Write-Host "Basarili: $endpoint"
              Write-Host "Response: $($response | ConvertTo-Json)"
              $success = $true
              break
            } catch {
              Write-Host "Basarisiz: $_"
            }
          }
          
          if (-not $success) {
            Write-Host "API endpoint'leri calismadi, PATCH methodu deneniyor..."
            foreach ($endpoint in $endpoints) {
              try {
                $response = Invoke-RestMethod -Uri $endpoint -Method PATCH -Body $body -Headers $headers -TimeoutSec 10
                Write-Host "PATCH Basarili: $endpoint"
                $success = $true
                break
              } catch {
                # Devam et
              }
            }
          }
          
          if ($success) {
            Write-Host "✅ Require API Key otomatik kapatildi"
          } else {
            Write-Host "⚠️ API ile kapatilamadi, veritabani manipülasyonu deneniyor..."
            
            # Veritabani yolunu bul ve manipüle et
            $dbPaths = @(
              "$env:USERPROFILE\.9router\data.db",
              "$env:USERPROFILE\.9router\settings.db",
              "$env:APPDATA\9router\data.db"
            )
            
            foreach ($dbPath in $dbPaths) {
              if (Test-Path $dbPath) {
                Write-Host "Veritabani bulundu: $dbPath"
                # SQLite3 kurulu degilse, Node.js ile guncelle
                $dbCode = "const Database = require('better-sqlite3'); const db = new Database('$dbPath'); db.exec('UPDATE settings SET value = ''false'' WHERE key = ''requireApiKey'''); db.close(); console.log('DB updated');"
                Set-Content -Path "update-db.js" -Value $dbCode -Encoding UTF8
                npm install better-sqlite3
                node update-db.js
                break
              }
            }
          }

      - name: Create Cloudflare Tunnel
        run: |
          Write-Host "Cloudflared indiriliyor..."
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "cloudflared.exe"
          
          $outLog = "cf-out.log"
          $errLog = "cf-err.log"
          
          Write-Host "Tunnel baslatiliyor (proxy:20129)..."
          Start-Process -NoNewWindow -FilePath ".\cloudflared.exe" -ArgumentList "tunnel", "--url", "http://127.0.0.1:20129" -RedirectStandardOutput $outLog -RedirectStandardError $errLog
          
          $tunnelUrl = ""
          for ($i = 1; $i -le 50; $i++) {
            Start-Sleep -Seconds 3
            $content = ""
            if (Test-Path $outLog) { $content += Get-Content $outLog -Raw -ErrorAction SilentlyContinue }
            if (Test-Path $errLog) { $content += Get-Content $errLog -Raw -ErrorAction SilentlyContinue }
            if ($content -match 'https://[a-zA-Z0-9-]+\.(trycloudflare\.com|cfargotunnel\.com)') {
              $tunnelUrl = $matches[0]
              break
            }
            Write-Host "Tunnel URL bekleniyor... ($i/50)"
          }
          
          if ($tunnelUrl) {
            Write-Host ""
            Write-Host "============================================"
            Write-Host "9ROUTER TUNNEL HAZIR!"
            Write-Host "============================================"
            Write-Host "TUNNEL URL  : $tunnelUrl"
            Write-Host "9ROUTER API : $tunnelUrl/v1"
            Write-Host "API KEY     : Gerekli degil (otomatik kapatildi)"
            Write-Host "RDP USER    : runneradmin"
            Write-Host "RDP PASS    : P@ssw0rd123!"
            Write-Host "============================================"
            Write-Host ""
            Write-Host "Dashboard'a erismek icin:"
            Write-Host "$tunnelUrl/dashboard"
          } else {
            Write-Host "Tunnel URL alinamadi!"
            if (Test-Path $errLog) { Get-Content $errLog }
            exit 1
          }
          
          while ($true) {
            Start-Sleep -Seconds 60
            Write-Host "Aktif - $(Get-Date -Format 'HH:mm:ss')"
          }
