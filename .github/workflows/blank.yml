name: LINUX - 9ROUTER TUNNEL

on:
  workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install 9router
        run: |
          npm install -g 9router
          echo "9router installed"

      - name: Pre-warm 9router runtime deps
        run: |
          # 9router's first boot blocks on `npm install better-sqlite3` (native compile)
          # and systray2. Install them ahead of time so the server starts fast.
          set -e
          RUNTIME_DIR="$HOME/.9router/runtime"
          mkdir -p "$RUNTIME_DIR"
          cd "$RUNTIME_DIR"
          if [ ! -f package.json ]; then
            npm init -y >/dev/null 2>&1
          fi
          echo "Installing better-sqlite3, sql.js, systray2 into runtime..."
          npm install --no-audit --no-fund \
            better-sqlite3@12.6.2 \
            sql.js@1.14.1 \
            systray2@2.1.4 2>&1 | tail -8
          echo "Runtime deps installed:"
          ls node_modules | grep -E "better-sqlite3|sql.js|systray2" || true

      - name: Bootstrap 9router DB
        run: |
          echo "Starting 9router to create database..."
          nohup 9router --tray --skip-update > bootstrap.log 2>&1 &
          ROUTER_PID=$!
          echo "9router PID: $ROUTER_PID"

          code="000"
          for i in $(seq 1 200); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:20128/ --max-time 2 2>/dev/null || echo "000")
            if [ "$code" != "000" ]; then
              echo "9router ready on port 20128 (attempt $i, HTTP $code)"
              break
            fi
            if [ $((i % 10)) -eq 0 ]; then
              echo "Still waiting for 9router... ($i/200) — last log lines:"
              tail -3 bootstrap.log 2>/dev/null || true
            fi
            sleep 3
          done

          echo "Final port check code: $code"
          if [ "$code" = "000" ]; then
            echo "WARNING: 9router did not become ready. Dumping bootstrap.log:"
            cat bootstrap.log
            echo "Killing stuck process..."
            kill $ROUTER_PID 2>/dev/null || true
            exit 1
          fi

          echo "Stopping 9router (DB is now created)..."
          kill $ROUTER_PID 2>/dev/null || true
          sleep 3
          echo "9router stopped."

          echo ""
          echo "=== Searching for DB files ==="
          find ~/.9router -type f 2>/dev/null | while read f; do
            echo "  $f ($(stat -c%s "$f" 2>/dev/null) bytes)"
          done
          if [ ! -d ~/.9router ]; then
            echo "  .9router dir not found!"
          fi

      - name: Patch DB - Disable requireApiKey
        run: |
          python3 << 'PYEOF'
          import sqlite3, os, sys, json

          print("=" * 60)
          print("9ROUTER DB PATCHER - LINUX")
          print("=" * 60)

          home = os.path.expanduser("~")

          db_candidates = [
              os.path.join(home, ".9router", "db", "data.sqlite"),
              os.path.join(home, ".9router", "data.sqlite"),
              os.path.join(home, ".9router", "db.sqlite"),
              os.path.join(home, ".9router", "9router.db"),
              os.path.join(home, ".9router", "db", "9router.sqlite"),
          ]

          nine_dir = os.path.join(home, ".9router")
          if os.path.exists(nine_dir):
              for root, dirs, files in os.walk(nine_dir):
                  for f in files:
                      if f.endswith((".sqlite", ".sqlite3", ".db")):
                          full = os.path.join(root, f)
                          if full not in db_candidates:
                              db_candidates.append(full)

          db_path = None
          for candidate in db_candidates:
              print(f"  Checking: {candidate}")
              if os.path.exists(candidate):
                  with open(candidate, "rb") as fh:
                      magic = fh.read(16)
                  if magic.startswith(b"SQLite format 3"):
                      db_path = candidate
                      print(f"  >>> FOUND VALID SQLITE: {candidate}")
                      break
                  else:
                      print(f"  >>> Exists but not SQLite (magic: {magic[:10]})")
              else:
                  print(f"  >>> Not found")

          if not db_path:
              print("\nFATAL: No valid SQLite DB found!")
              if os.path.exists(nine_dir):
                  for root, dirs, files in os.walk(nine_dir):
                      for f in files:
                          print(f"  {os.path.join(root, f)}")
              else:
                  print(f"  {nine_dir} does not exist!")
              sys.exit(1)

          print(f"\nPatching: {db_path}")
          print("-" * 40)

          conn = sqlite3.connect(db_path)
          cur = conn.cursor()

          cur.execute("SELECT name FROM sqlite_master WHERE type='table'")
          tables = [t[0] for t in cur.fetchall()]
          print(f"Tables: {tables}")

          settings_table = None
          for t in tables:
              if "setting" in t.lower() or "config" in t.lower() or "option" in t.lower():
                  settings_table = t
                  break

          if not settings_table:
              for t in tables:
                  cur.execute(f"PRAGMA table_info({t})")
                  cols = [c[1] for c in cur.fetchall()]
                  if "data" in cols or "json" in cols or "value" in cols:
                      settings_table = t
                      print(f"  Using table '{t}' as settings (cols: {cols})")
                      break

          if not settings_table and tables:
              settings_table = tables[0]
              print(f"  Fallback: using first table '{settings_table}'")

          if not settings_table:
              print("FATAL: No suitable table found!")
              sys.exit(1)

          print(f"\nTarget table: {settings_table}")
          cur.execute(f"PRAGMA table_info({settings_table})")
          cols = [(c[1], c[2]) for c in cur.fetchall()]
          print(f"Columns: {cols}")

          cur.execute(f"SELECT * FROM {settings_table} LIMIT 10")
          rows = cur.fetchall()
          print(f"Current rows ({len(rows)}):")
          for row in rows:
              print(f"  {row}")

          col_names = [c[0] for c in cols]
          data_col = None
          id_col = None

          for c in col_names:
              cl = c.lower()
              if cl in ["data", "json", "config", "blob", "settings_json"]:
                  data_col = c
              if cl in ["id", "rowid", "pk", "key_id"]:
                  id_col = c

          patched = False

          if data_col:
              print(f"\n  JSON data column found: '{data_col}'")
              if id_col:
                  cur.execute(f"SELECT {data_col} FROM {settings_table} WHERE {id_col} = 1")
                  row = cur.fetchone()
              else:
                  cur.execute(f"SELECT {data_col} FROM {settings_table} LIMIT 1")
                  row = cur.fetchone()

              if row and row[0]:
                  try:
                      data = json.loads(row[0])
                      print(f"  Current JSON: {json.dumps(data, indent=2)[:500]}")
                      data["requireApiKey"] = False
                      data["requireLogin"] = False
                      data["require_auth"] = False
                      new_json = json.dumps(data)
                      if id_col:
                          cur.execute(f"UPDATE {settings_table} SET {data_col} = ? WHERE {id_col} = 1", (new_json,))
                      else:
                          cur.execute(f"UPDATE {settings_table} SET {data_col} = ?", (new_json,))
                      print(f"  UPDATED! requireApiKey -> false")
                      patched = True
                  except json.JSONDecodeError:
                      old_val = row[0]
                      new_val = old_val.replace('"requireApiKey":true', '"requireApiKey":false')
                      new_val = new_val.replace('"requireApiKey": true', '"requireApiKey": false')
                      new_val = new_val.replace('"requireApiKey":1', '"requireApiKey":0')
                      if new_val != old_val:
                          cur.execute(f"UPDATE {settings_table} SET {data_col} = ?", (new_val,))
                          print(f"  String replacement done!")
                          patched = True
              else:
                  new_data = json.dumps({"requireApiKey": False, "requireLogin": False})
                  if id_col:
                      try:
                          cur.execute(f"INSERT INTO {settings_table} ({id_col}, {data_col}) VALUES (1, ?)", (new_data,))
                          print(f"  INSERTED new row with requireApiKey=false")
                          patched = True
                      except Exception as e:
                          print(f"  INSERT failed: {e}")
                  else:
                      try:
                          cur.execute(f"INSERT INTO {settings_table} ({data_col}) VALUES (?)", (new_data,))
                          print(f"  INSERTED new row")
                          patched = True
                      except Exception as e:
                          print(f"  INSERT failed: {e}")
          else:
              print(f"\n  No JSON data column found. Trying key-value approach...")
              key_col = None
              val_col = None
              for c in col_names:
                  cl = c.lower()
                  if cl in ["key", "name", "setting", "option", "field"]:
                      key_col = c
                  if cl in ["value", "val", "enabled", "data"]:
                      val_col = c
              if key_col and val_col:
                  for tk in ["requireApiKey", "require_api_key", "requireLogin"]:
                      for v in ["false", "0", "off"]:
                          try:
                              cur.execute(f"UPDATE {settings_table} SET {val_col}=? WHERE LOWER({key_col})=LOWER(?)", (v, tk))
                              if cur.rowcount > 0:
                                  print(f"  Updated {tk} -> {v} ({cur.rowcount} rows)")
                                  patched = True
                          except:
                              pass
                      try:
                          cur.execute(f"INSERT OR REPLACE INTO {settings_table} ({key_col}, {val_col}) VALUES (?, ?)", (tk, "false"))
                          print(f"  INSERT OR REPLACE: {tk} = false")
                          patched = True
                      except:
                          pass

          if not patched and data_col and id_col:
              try:
                  cur.execute(f"""
                      INSERT INTO {settings_table} ({id_col}, {data_col})
                      VALUES (1, '{{"requireApiKey":false}}')
                      ON CONFLICT({id_col}) DO UPDATE SET
                      {data_col} = json_set({settings_table}.{data_col}, '$.requireApiKey', json('false'))
                  """)
                  print(f"  json_set approach executed")
                  patched = True
              except Exception as e:
                  print(f"  json_set failed: {e}")

          conn.commit()

          print(f"\nVerification:")
          if data_col:
              if id_col:
                  cur.execute(f"SELECT {data_col} FROM {settings_table} WHERE {id_col} = 1")
              else:
                  cur.execute(f"SELECT {data_col} FROM {settings_table} LIMIT 1")
              row = cur.fetchone()
              if row:
                  print(f"  Final data: {row[0][:500]}")
                  if "false" in str(row[0]).lower() or '"requireApiKey": false' in str(row[0]):
                      print(f"  >>> CONFIRMED: requireApiKey is FALSE")
                  else:
                      print(f"  >>> WARNING: Could not confirm requireApiKey=false")

          conn.close()
          print(f"\n{'='*60}")
          print(f"RESULT: patched = {patched}")
          print(f"{'='*60}")
          PYEOF

      - name: Create Proxy and Start 9router
        run: |
          cat > proxy.js << 'PROXYEOF'
          const http = require("http");
          const server = http.createServer((req, res) => {
            const h = { ...req.headers };
            const strip = ["cf-connecting-ip","cf-ipcountry","cf-ray","cf-visitor","cf-worker","cf-colo","x-forwarded-for","x-forwarded-proto","x-forwarded-host","x-forwarded-server","x-forwarded-port","x-forwarded-scheme","x-real-ip","forwarded","true-client-ip","x-original-forwarded-for","x-client-ip","x-cluster-client-ip","via","x-request-id","cf-request-id","cf-cache-status","expect-ct","nel","report-to","alt-svc"];
            for (const k of strip) delete h[k];
            h["host"] = "localhost:20128";
            h["origin"] = "http://localhost:20128";
            h["referer"] = "http://localhost:20128/";
            h["sec-fetch-site"] = "same-origin";
            h["sec-fetch-mode"] = "cors";
            h["sec-fetch-dest"] = "empty";
            const opts = { hostname: "127.0.0.1", port: 20128, path: req.url, method: req.method, headers: h };
            const p = http.request(opts, (pr) => {
              res.writeHead(pr.statusCode, pr.headers);
              pr.pipe(res, { end: true });
            });
            req.pipe(p, { end: true });
            p.on("error", () => { res.writeHead(502); res.end("proxy error"); });
          });
          server.listen(20129, "127.0.0.1", () => console.log("PROXY_READY"));
          PROXYEOF

          nohup node proxy.js > proxy.log 2>&1 &
          sleep 3
          echo "Proxy started on port 20129"

          echo "Starting 9router with patched DB..."
          nohup 9router --tray --skip-update > 9router.log 2>&1 &
          echo "9router started in tray mode"

          code="000"
          for i in $(seq 1 200); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:20128/ --max-time 2 2>/dev/null || echo "000")
            if [ "$code" != "000" ]; then
              echo "9router ready (attempt $i, HTTP $code)"
              break
            fi
            if [ $((i % 10)) -eq 0 ]; then
              echo "Still waiting for 9router... ($i/200) — last log lines:"
              tail -3 9router.log 2>/dev/null || true
            fi
            sleep 3
          done

          if [ "$code" = "000" ]; then
            echo "9router failed to start. Dumping 9router.log:"
            cat 9router.log
            exit 1
          fi

          echo ""
          echo "=== TESTING ==="
          health=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:20128/api/health --max-time 5 2>/dev/null || echo "000")
          echo "Health: $health"

          echo "Testing /v1/models via proxy (no auth)..."
          MODELS=$(curl -s http://127.0.0.1:20129/v1/models --max-time 10 2>/dev/null || echo "")
          if echo "$MODELS" | python3 -c "import sys,json; d=json.loads(sys.stdin.read()); print('SUCCESS: /v1/models works WITHOUT auth! Models:', len(d.get('data',[])))" 2>/dev/null; then
            echo "Proxy OK"
          else
            echo "FAILED via proxy. Testing direct..."
            DIRECT=$(curl -s http://127.0.0.1:20128/v1/models --max-time 10 2>/dev/null || echo "")
            if echo "$DIRECT" | python3 -c "import sys,json; d=json.loads(sys.stdin.read()); print('Direct OK:', len(d.get('data',[])), 'models')" 2>/dev/null; then
              echo "Direct OK"
            else
              echo "Direct also failed"
            fi
          fi

      - name: Create Tunnel
        run: |
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared

          nohup ./cloudflared tunnel --url http://127.0.0.1:20129 > cf-out.log 2>&1 &
          echo "cloudflared started"

          tunnelUrl=""
          for i in $(seq 1 60); do
            sleep 3
            content=""
            if [ -f cf-out.log ]; then content=$(cat cf-out.log); fi
            url=$(echo "$content" | grep -oE 'https://[a-zA-Z0-9-]+\.(trycloudflare\.com|cfargotunnel\.com)' | head -1)
            if [ -n "$url" ]; then
              tunnelUrl="$url"
              break
            fi
            echo "Waiting for tunnel... ($i/60)"
          done

          if [ -n "$tunnelUrl" ]; then
            echo ""
            echo "============================================"
            echo "9ROUTER TUNNEL READY"
            echo "============================================"
            echo "TUNNEL URL  : $tunnelUrl"
            echo "9ROUTER API : $tunnelUrl/v1"
            echo "API KEY     : NOT REQUIRED (DB patched)"
            echo "============================================"
            echo "Dashboard   : $tunnelUrl/dashboard"
            echo "============================================"
          else
            echo "TUNNEL FAILED"
            if [ -f cf-out.log ]; then cat cf-out.log; fi
            exit 1
          fi

          echo ""
          echo "Keeping alive..."
          while true; do
            sleep 60
            echo "Alive - $(date '+%H:%M:%S')"
          done
