name: WINDOWS RDP - 9ROUTER TUNNEL (FINAL)

on:
  workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Enable RDP + Password + Keyboard
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
          $securePassword = ConvertTo-SecureString -AsPlainText "P@ssw0rd123!" -Force
          Set-LocalUser -Name "runneradmin" -Password $securePassword
          $LangList = New-WinUserLanguageList tr-TR
          $LangList[0].InputMethodTips.Clear()
          $LangList[0].InputMethodTips.Add("041F:0000041F")
          Set-WinUserLanguageList -LanguageList $LangList -Force
          Set-WinSystemLocale -SystemLocale tr-TR
          Set-Culture -CultureInfo tr-TR
          Write-Host "System configured"

      - name: Install 9router
        run: |
          npm install -g 9router
          Write-Host "9router installed"

      - name: Bootstrap 9router DB
        run: |
          Write-Host "Starting 9router to create database..."
          Start-Process -FilePath "cmd.exe" -ArgumentList "/c", "9router" -WindowStyle Hidden
          Start-Sleep -Seconds 30
          Write-Host "Stopping 9router..."
          Get-Process -Name "node" -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 5
          Write-Host "9router stopped."
          Write-Host ""
          Write-Host "=== Searching for DB files ==="
          $homeDir = $env:USERPROFILE
          Get-ChildItem -Path "$homeDir\.9router" -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.FullName) ($($_.Length) bytes)" }
          if (-not (Test-Path "$homeDir\.9router")) {
              Write-Host "  .9router dir not found! Searching wider..."
              Get-ChildItem -Path "$homeDir" -Recurse -Filter "*.sqlite" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  SQLITE: $($_.FullName)" }
              Get-ChildItem -Path "$homeDir" -Recurse -Filter "*.db" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  DB: $($_.FullName)" }
          }

      - name: Patch DB - Disable requireApiKey (CORRECT METHOD)
        run: |
          @'
          import sqlite3, os, sys, json

          print("=" * 60)
          print("9ROUTER DB PATCHER - CORRECT METHOD")
          print("settings table: id=1, data=JSON blob")
          print("=" * 60)

          home = os.path.expanduser("~")

          # Possible DB paths (9router uses ~/.9router/db/data.sqlite)
          db_candidates = [
              os.path.join(home, ".9router", "db", "data.sqlite"),
              os.path.join(home, ".9router", "data.sqlite"),
              os.path.join(home, ".9router", "db.sqlite"),
              os.path.join(home, ".9router", "9router.db"),
              os.path.join(home, ".9router", "db", "9router.sqlite"),
              os.path.join(os.environ.get("APPDATA", ""), "9router", "db", "data.sqlite"),
              os.path.join(os.environ.get("LOCALAPPDATA", ""), "9router", "db", "data.sqlite"),
          ]

          # Also search for any sqlite/db files under .9router
          nine_dir = os.path.join(home, ".9router")
          if os.path.exists(nine_dir):
              for root, dirs, files in os.walk(nine_dir):
                  for f in files:
                      if f.endswith((".sqlite", ".sqlite3", ".db")):
                          full = os.path.join(root, f)
                          if full not in db_candidates:
                              db_candidates.append(full)

          db_path = None
          for candidate in db_candidates:
              print(f"  Checking: {candidate}")
              if os.path.exists(candidate):
                  with open(candidate, "rb") as fh:
                      magic = fh.read(16)
                  if magic.startswith(b"SQLite format 3"):
                      db_path = candidate
                      print(f"  >>> FOUND VALID SQLITE: {candidate}")
                      break
                  else:
                      print(f"  >>> Exists but not SQLite (magic: {magic[:10]})")
              else:
                  print(f"  >>> Not found")

          if not db_path:
              print("\nFATAL: No valid SQLite DB found!")
              print("Listing .9router directory contents:")
              if os.path.exists(nine_dir):
                  for root, dirs, files in os.walk(nine_dir):
                      for f in files:
                          print(f"  {os.path.join(root, f)}")
              else:
                  print(f"  {nine_dir} does not exist!")
              sys.exit(1)

          print(f"\nPatching: {db_path}")
          print("-" * 40)

          conn = sqlite3.connect(db_path)
          cur = conn.cursor()

          # Show all tables
          cur.execute("SELECT name FROM sqlite_master WHERE type='table'")
          tables = [t[0] for t in cur.fetchall()]
          print(f"Tables: {tables}")

          # Find the settings table (might be named differently)
          settings_table = None
          for t in tables:
              if "setting" in t.lower() or "config" in t.lower() or "option" in t.lower():
                  settings_table = t
                  break

          if not settings_table:
              # Try all tables, look for one with a JSON data column
              for t in tables:
                  cur.execute(f"PRAGMA table_info({t})")
                  cols = [c[1] for c in cur.fetchall()]
                  if "data" in cols or "json" in cols or "value" in cols:
                      settings_table = t
                      print(f"  Using table '{t}' as settings (cols: {cols})")
                      break

          if not settings_table and tables:
              settings_table = tables[0]
              print(f"  Fallback: using first table '{settings_table}'")

          if not settings_table:
              print("FATAL: No suitable table found!")
              sys.exit(1)

          print(f"\nTarget table: {settings_table}")
          cur.execute(f"PRAGMA table_info({settings_table})")
          cols = [(c[1], c[2]) for c in cur.fetchall()]
          print(f"Columns: {cols}")

          # Show current data
          cur.execute(f"SELECT * FROM {settings_table} LIMIT 10")
          rows = cur.fetchall()
          print(f"Current rows ({len(rows)}):")
          for row in rows:
              print(f"  {row}")

          # PATCH STRATEGY 1: JSON blob in 'data' column
          col_names = [c[0] for c in cols]
          data_col = None
          id_col = None

          for c in col_names:
              cl = c.lower()
              if cl in ["data", "json", "config", "blob", "settings_json"]:
                  data_col = c
              if cl in ["id", "rowid", "pk", "key_id"]:
                  id_col = c

          patched = False

          if data_col:
              print(f"\n  JSON data column found: '{data_col}'")

              if id_col:
                  # Read existing row
                  cur.execute(f"SELECT {data_col} FROM {settings_table} WHERE {id_col} = 1")
                  row = cur.fetchone()
              else:
                  cur.execute(f"SELECT {data_col} FROM {settings_table} LIMIT 1")
                  row = cur.fetchone()

              if row and row[0]:
                  try:
                      data = json.loads(row[0])
                      print(f"  Current JSON: {json.dumps(data, indent=2)[:500]}")

                      # Set requireApiKey to false
                      data["requireApiKey"] = False
                      data["requireLogin"] = False
                      data["require_auth"] = False

                      new_json = json.dumps(data)
                      if id_col:
                          cur.execute(f"UPDATE {settings_table} SET {data_col} = ? WHERE {id_col} = 1", (new_json,))
                      else:
                          cur.execute(f"UPDATE {settings_table} SET {data_col} = ?", (new_json,))
                      print(f"  UPDATED! requireApiKey -> false")
                      patched = True
                  except json.JSONDecodeError as e:
                      print(f"  JSON parse error: {e}")
                      # Maybe it's not JSON, try direct replacement
                      old_val = row[0]
                      new_val = old_val.replace('"requireApiKey":true', '"requireApiKey":false')
                      new_val = new_val.replace('"requireApiKey": true', '"requireApiKey": false')
                      new_val = new_val.replace('"requireApiKey":1', '"requireApiKey":0')
                      if new_val != old_val:
                          cur.execute(f"UPDATE {settings_table} SET {data_col} = ?", (new_val,))
                          print(f"  String replacement done!")
                          patched = True
              else:
                  # No row exists, insert one
                  new_data = json.dumps({"requireApiKey": False, "requireLogin": False})
                  if id_col:
                      try:
                          cur.execute(f"INSERT INTO {settings_table} ({id_col}, {data_col}) VALUES (1, ?)", (new_data,))
                          print(f"  INSERTED new row with requireApiKey=false")
                          patched = True
                      except Exception as e:
                          print(f"  INSERT failed: {e}")
                  else:
                      try:
                          cur.execute(f"INSERT INTO {settings_table} ({data_col}) VALUES (?)", (new_data,))
                          print(f"  INSERTED new row")
                          patched = True
                      except Exception as e:
                          print(f"  INSERT failed: {e}")
          else:
              print(f"\n  No JSON data column found. Trying key-value approach...")
              # Key-value fallback
              key_col = None
              val_col = None
              for c in col_names:
                  cl = c.lower()
                  if cl in ["key", "name", "setting", "option", "field"]:
                      key_col = c
                  if cl in ["value", "val", "enabled", "data"]:
                      val_col = c
              if key_col and val_col:
                  for tk in ["requireApiKey", "require_api_key", "requireLogin"]:
                      for v in ["false", "0", "off"]:
                          try:
                              cur.execute(f"UPDATE {settings_table} SET {val_col}=? WHERE LOWER({key_col})=LOWER(?)", (v, tk))
                              if cur.rowcount > 0:
                                  print(f"  Updated {tk} -> {v} ({cur.rowcount} rows)")
                                  patched = True
                          except:
                              pass
                      try:
                          cur.execute(f"INSERT OR REPLACE INTO {settings_table} ({key_col}, {val_col}) VALUES (?, ?)", (tk, "false"))
                          print(f"  INSERT OR REPLACE: {tk} = false")
                          patched = True
                      except:
                          pass

          # Also try SQLite json_set as ChatGPT suggested
          if not patched and data_col and id_col:
              try:
                  cur.execute(f"""
                      INSERT INTO {settings_table} ({id_col}, {data_col})
                      VALUES (1, '{{"requireApiKey":false}}')
                      ON CONFLICT({id_col}) DO UPDATE SET
                      {data_col} = json_set({settings_table}.{data_col}, '$.requireApiKey', json('false'))
                  """)
                  print(f"  json_set approach executed")
                  patched = True
              except Exception as e:
                  print(f"  json_set failed: {e}")

          conn.commit()

          # Verify
          print(f"\nVerification:")
          if data_col:
              if id_col:
                  cur.execute(f"SELECT {data_col} FROM {settings_table} WHERE {id_col} = 1")
              else:
                  cur.execute(f"SELECT {data_col} FROM {settings_table} LIMIT 1")
              row = cur.fetchone()
              if row:
                  print(f"  Final data: {row[0][:500]}")
                  if "false" in str(row[0]).lower() or '"requireApiKey": false' in str(row[0]) or '"requireApiKey":false' in str(row[0]):
                      print(f"  >>> CONFIRMED: requireApiKey is FALSE")
                  else:
                      print(f"  >>> WARNING: Could not confirm requireApiKey=false")

          conn.close()
          print(f"\n{'='*60}")
          print(f"RESULT: patched = {patched}")
          print(f"{'='*60}")
          '@ | Set-Content -Path "patch_db.py" -Encoding UTF8

          python patch_db.py

      - name: Create Proxy and Start 9router
        run: |
          @'
          const http = require("http");
          const server = http.createServer((req, res) => {
            const h = { ...req.headers };
            const strip = ["cf-connecting-ip","cf-ipcountry","cf-ray","cf-visitor","cf-worker","cf-colo","x-forwarded-for","x-forwarded-proto","x-forwarded-host","x-forwarded-server","x-forwarded-port","x-forwarded-scheme","x-real-ip","forwarded","true-client-ip","x-original-forwarded-for","x-client-ip","x-cluster-client-ip","via","x-request-id","cf-request-id","cf-cache-status","expect-ct","nel","report-to","alt-svc"];
            for (const k of strip) delete h[k];
            h["host"] = "localhost:20128";
            h["origin"] = "http://localhost:20128";
            h["referer"] = "http://localhost:20128/";
            h["sec-fetch-site"] = "same-origin";
            h["sec-fetch-mode"] = "cors";
            h["sec-fetch-dest"] = "empty";
            const opts = { hostname: "127.0.0.1", port: 20128, path: req.url, method: req.method, headers: h };
            const p = http.request(opts, (pr) => {
              res.writeHead(pr.statusCode, pr.headers);
              pr.pipe(res, { end: true });
            });
            req.pipe(p, { end: true });
            p.on("error", () => { res.writeHead(502); res.end("proxy error"); });
          });
          server.listen(20129, "127.0.0.1", () => console.log("PROXY_READY"));
          '@ | Set-Content -Path "proxy.js" -Encoding UTF8

          Start-Process -FilePath "node" -ArgumentList "proxy.js" -WindowStyle Hidden
          Start-Sleep -Seconds 3
          Write-Host "Proxy started on 20129"

          Write-Host "Starting 9router with patched DB..."
          Start-Process -FilePath "cmd.exe" -ArgumentList "/c", "9router" -WindowStyle Hidden
          Start-Sleep -Seconds 30

          # Test
          Write-Host ""
          Write-Host "=== TESTING ==="
          try {
              $r = Invoke-RestMethod -Uri "http://127.0.0.1:20128/api/health" -Method GET -TimeoutSec 5
              Write-Host "Health: OK"
          } catch {
              Write-Host "Health: FAILED - $_"
          }

          Write-Host "Testing /v1/models via proxy (no auth)..."
          try {
              $m = Invoke-RestMethod -Uri "http://127.0.0.1:20129/v1/models" -Method GET -TimeoutSec 10
              Write-Host "SUCCESS: /v1/models works WITHOUT auth! Models: $($m.data.Count)"
          } catch {
              Write-Host "FAILED via proxy: $_"
              Write-Host "Testing direct..."
              try {
                  $m2 = Invoke-RestMethod -Uri "http://127.0.0.1:20128/v1/models" -Method GET -TimeoutSec 10
                  Write-Host "Direct OK: $($m2.data.Count) models"
              } catch {
                  Write-Host "Direct also failed: $_"
              }
          }

      - name: Create Tunnel
        run: |
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "cloudflared.exe"
          Start-Process -NoNewWindow -FilePath ".\cloudflared.exe" -ArgumentList "tunnel", "--url", "http://127.0.0.1:20129" -RedirectStandardOutput "cf-out.log" -RedirectStandardError "cf-err.log"

          $tunnelUrl = ""
          for ($i = 1; $i -le 60; $i++) {
              Start-Sleep -Seconds 3
              $content = ""
              if (Test-Path "cf-out.log") { $content += Get-Content "cf-out.log" -Raw -ErrorAction SilentlyContinue }
              if (Test-Path "cf-err.log") { $content += Get-Content "cf-err.log" -Raw -ErrorAction SilentlyContinue }
              if ($content -match "https://[a-zA-Z0-9-]+\.(trycloudflare\.com|cfargotunnel\.com)") {
                  $tunnelUrl = $matches[0]
                  break
              }
              Write-Host "Waiting for tunnel... ($i/60)"
          }

          if ($tunnelUrl) {
              Write-Host ""
              Write-Host "============================================"
              Write-Host "9ROUTER TUNNEL READY"
              Write-Host "============================================"
              Write-Host "TUNNEL URL  : $tunnelUrl"
              Write-Host "9ROUTER API : $tunnelUrl/v1"
              Write-Host "API KEY     : NOT REQUIRED (DB patched)"
              Write-Host "RDP USER    : runneradmin"
              Write-Host "RDP PASS    : P@ssw0rd123!"
              Write-Host "============================================"
              Write-Host "Dashboard: $tunnelUrl/dashboard"
          } else {
              Write-Host "TUNNEL FAILED"
              if (Test-Path "cf-err.log") { Get-Content "cf-err.log" }
              exit 1
          }

          while ($true) {
              Start-Sleep -Seconds 60
              Write-Host "Alive - $(Get-Date -Format 'HH:mm:ss')"
          }
