name: WINDOWS RDP - 9ROUTER TUNNEL (BULLETPROOF)

on:
  workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Install Node.js and Python
        run: |
          Write-Host "Setup complete - Node 22 and Python already available on windows-latest"

      - name: Enable Windows RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
          Write-Host "RDP Enabled"

      - name: Set Password
        run: |
          $securePassword = ConvertTo-SecureString -AsPlainText "P@ssw0rd123!" -Force
          Set-LocalUser -Name "runneradmin" -Password $securePassword
          Write-Host "Password set"

      - name: Set Turkish Q Keyboard
        run: |
          $LangList = New-WinUserLanguageList tr-TR
          $LangList[0].InputMethodTips.Clear()
          $LangList[0].InputMethodTips.Add("041F:0000041F")
          Set-WinUserLanguageList -LanguageList $LangList -Force
          Set-WinSystemLocale -SystemLocale tr-TR
          Set-Culture -CultureInfo tr-TR
          Write-Host "Turkish Q keyboard set"

      - name: Install 9router and Start It Once
        run: |
          npm install -g 9router
          Write-Host "9router baslatiliyor (DB olusturulacak)..."
          Start-Process -FilePath "cmd.exe" -ArgumentList "/c", "9router" -WindowStyle Hidden
          Start-Sleep -Seconds 30
          Write-Host "9router DB olusturuldu"

      - name: Stop 9router
        run: |
          Get-Process -Name "node" -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-Process -Name "9router" -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-Process | Where-Object { $_.MainWindowTitle -like "*9router*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5
          Write-Host "9router durduruldu"

      - name: Create Python Script (Safe, No PowerShell Expansion)
        run: |
          $scriptLines = @()
          $scriptLines += "import sqlite3, os, glob, json, sys, shutil"
          $scriptLines += ""
          $scriptLines += "def find_all_configs():"
          $scriptLines += "    paths = []"
          $scriptLines += "    home = os.path.expanduser('~')"
          $scriptLines += "    appdata = os.environ.get('APPDATA', '')"
          $scriptLines += "    localappdata = os.environ.get('LOCALAPPDATA', '')"
          $scriptLines += "    programdata = os.environ.get('PROGRAMDATA', '')"
          $scriptLines += ""
          $scriptLines += "    search_dirs = []"
          $scriptLines += "    for base in [home, appdata, localappdata, programdata]:"
          $scriptLines += "        if base:"
          $scriptLines += "            search_dirs.append(os.path.join(base, '.9router'))"
          $scriptLines += "            search_dirs.append(os.path.join(base, '9router'))"
          $scriptLines += ""
          $scriptLines += "    for d in search_dirs:"
          $scriptLines += "        if os.path.exists(d):"
          $scriptLines += "            print(f'Found dir: {d}')"
          $scriptLines += "            for root, dirs, files in os.walk(d):"
          $scriptLines += "                for f in files:"
          $scriptLines += "                    full = os.path.join(root, f)"
          $scriptLines += "                    paths.append(full)"
          $scriptLines += "    return paths"
          $scriptLines += ""
          $scriptLines += "def update_json(path):"
          $scriptLines += "    try:"
          $scriptLines += "        with open(path, 'r', encoding='utf-8') as f:"
          $scriptLines += "            content = f.read()"
          $scriptLines += "        try:"
          $scriptLines += "            data = json.loads(content)"
          $scriptLines += "        except:"
          $scriptLines += "            return False"
          $scriptLines += "        "
          $scriptLines += "        changed = False"
          $scriptLines += "        keys_to_check = ['requireApiKey', 'require_api_key', 'requireLogin']"
          $scriptLines += "        for k in keys_to_check:"
          $scriptLines += "            if k in data:"
          $scriptLines += "                print(f'  Found {k}={data[k]} in {path}')"
          $scriptLines += "                data[k] = False"
          $scriptLines += "                changed = True"
          $scriptLines += "        "
          $scriptLines += "        def walk(obj):"
          $scriptLines += "            if isinstance(obj, dict):"
          $scriptLines += "                for k, v in obj.items():"
          $scriptLines += "                    if isinstance(v, (dict, list)):"
          $scriptLines += "                        walk(v)"
          $scriptLines += "                    elif k.lower() in ['requireapikey', 'require_api_key', 'requirelogin']:"
          $scriptLines += "                        print(f'  Found nested {k}={v}')"
          $scriptLines += "                        obj[k] = False"
          $scriptLines += "            elif isinstance(obj, list):"
          $scriptLines += "                for item in obj:"
          $scriptLines += "                    walk(item)"
          $scriptLines += "        walk(data)"
          $scriptLines += "        "
          $scriptLines += "        if changed or True:"
          $scriptLines += "            with open(path, 'w', encoding='utf-8') as f:"
          $scriptLines += "                json.dump(data, f, indent=2)"
          $scriptLines += "            print(f'  Updated JSON: {path}')"
          $scriptLines += "            return True"
          $scriptLines += "    except Exception as e:"
          $scriptLines += "        print(f'  JSON error: {e}')"
          $scriptLines += "    return False"
          $scriptLines += ""
          $scriptLines += "def update_sqlite(path):"
          $scriptLines += "    try:"
          $scriptLines += "        with open(path, 'rb') as f:"
          $scriptLines += "            header = f.read(16)"
          $scriptLines += "        if not header.startswith(b'SQLite format 3'):"
          $scriptLines += "            return False"
          $scriptLines += "        "
          $scriptLines += "        print(f'Updating SQLite: {path}')"
          $scriptLines += "        conn = sqlite3.connect(path)"
          $scriptLines += "        cursor = conn.cursor()"
          $scriptLines += "        "
          $scriptLines += "        cursor.execute(\"SELECT name FROM sqlite_master WHERE type='table'\")"
          $scriptLines += "        tables = [t[0] for t in cursor.fetchall()]"
          $scriptLines += "        print(f'  Tables: {tables}')"
          $scriptLines += "        "
          $scriptLines += "        for table in tables:"
          $scriptLines += "            try:"
          $scriptLines += "                cursor.execute(f'PRAGMA table_info({table})')"
          $scriptLines += "                cols = [c[1] for c in cursor.fetchall()]"
          $scriptLines += "                "
          $scriptLines += "                for col in cols:"
          $scriptLines += "                    if 'requireapikey' in col.lower() or 'require_api_key' in col.lower() or 'requirelogin' in col.lower():"
          $scriptLines += "                        cursor.execute(f'UPDATE {table} SET {col} = 0')"
          $scriptLines += "                        cursor.execute(f'UPDATE {table} SET {col} = \'false\'')"
          $scriptLines += "                        print(f'  Updated col {col} in {table}: {cursor.rowcount} rows')"
          $scriptLines += "                "
          $scriptLines += "                if len(cols) >= 2:"
          $scriptLines += "                    key_col = None"
          $scriptLines += "                    val_col = None"
          $scriptLines += "                    for c in cols:"
          $scriptLines += "                        cl = c.lower()"
          $scriptLines += "                        if 'key' in cl or 'name' in cl or 'setting' in cl:"
          $scriptLines += "                            key_col = c"
          $scriptLines += "                        if 'value' in cl or 'val' in cl or 'data' in cl or 'enabled' in cl:"
          $scriptLines += "                            val_col = c"
          $scriptLines += "                    if key_col and val_col:"
          $scriptLines += "                        for key_name in ['requireApiKey', 'require_api_key', 'requireLogin', 'require_api_key_enabled']:"
          $scriptLines += "                            for val in ['false', '0', 0, 'FALSE']:"
          $scriptLines += "                                try:"
          $scriptLines += "                                    cursor.execute(f\"UPDATE {table} SET {val_col} = ? WHERE LOWER({key_col}) = ?\", (val, key_name.lower()))"
          $scriptLines += "                                    if cursor.rowcount > 0:"
          $scriptLines += "                                        print(f'  Updated {table}: {key_name} -> {val}')"
          $scriptLines += "                                except:"
          $scriptLines += "                                    pass"
          $scriptLines += "            except Exception as e:"
          $scriptLines += "                print(f'  Table error: {e}')"
          $scriptLines += "        "
          $scriptLines += "        conn.commit()"
          $scriptLines += "        conn.close()"
          $scriptLines += "        return True"
          $scriptLines += "    except Exception as e:"
          $scriptLines += "        print(f'  SQLite error: {e}')"
          $scriptLines += "    return False"
          $scriptLines += ""
          $scriptLines += "print('=== Starting comprehensive config update ===')"
          $scriptLines += "files = find_all_configs()"
          $scriptLines += "print(f'Found {len(files)} files to check')"
          $scriptLines += ""
          $scriptLines += "updated_json = 0"
          $scriptLines += "updated_db = 0"
          $scriptLines += ""
          $scriptLines += "for f in files:"
          $scriptLines += "    if f.endswith('.db') or f.endswith('.sqlite') or f.endswith('.sqlite3'):"
          $scriptLines += "        if update_sqlite(f):"
          $scriptLines += "            updated_db += 1"
          $scriptLines += "    elif f.endswith('.json'):"
          $scriptLines += "        if update_json(f):"
          $scriptLines += "            updated_json += 1"
          $scriptLines += "    elif f.endswith('.toml') or f.endswith('.yaml') or f.endswith('.yml'):"
          $scriptLines += "        try:"
          $scriptLines += "            with open(f, 'r', encoding='utf-8') as fh:"
          $scriptLines += "                content = fh.read()"
          $scriptLines += "            if 'requireApiKey' in content or 'require_api_key' in content:"
          $scriptLines += "                content = content.replace('requireApiKey: true', 'requireApiKey: false')"
          $scriptLines += "                content = content.replace('requireApiKey = true', 'requireApiKey = false')"
          $scriptLines += "                content = content.replace('require_api_key: true', 'require_api_key: false')"
          $scriptLines += "                content = content.replace('require_api_key = true', 'require_api_key = false')"
          $scriptLines += "                with open(f, 'w', encoding='utf-8') as fh:"
          $scriptLines += "                    fh.write(content)"
          $scriptLines += "                print(f'Updated text config: {f}')"
          $scriptLines += "        except:"
          $scriptLines += "            pass"
          $scriptLines += ""
          $scriptLines += "print(f'=== Done: {updated_db} DBs, {updated_json} JSONs updated ===')"
          
          $scriptLines | Set-Content -Path "update_config.py" -Encoding UTF8
          Write-Host "Python script created successfully"
          Get-Content "update_config.py" | Select-Object -First 5

      - name: Run Python Script to Disable requireApiKey
        run: |
          python update_config.py

      - name: Create Loopback Proxy
        run: |
          $proxyLines = @()
          $proxyLines += "const http = require('http');"
          $proxyLines += "const server = http.createServer((req, res) => {"
          $proxyLines += "  const h = { ...req.headers };"
          $proxyLines += "  const remove = ['cf-connecting-ip','cf-ipcountry','cf-ray','cf-visitor','cf-worker','cf-colo','x-forwarded-for','x-forwarded-proto','x-forwarded-host','x-forwarded-server','x-forwarded-port','x-real-ip','forwarded','true-client-ip','x-original-forwarded-for','x-client-ip','x-cluster-client-ip','via','x-request-id','x-forwarded-scheme'];"
          $proxyLines += "  for (const k of remove) delete h[k];"
          $proxyLines += "  h['host'] = 'localhost:20128';"
          $proxyLines += "  h['origin'] = 'http://localhost:20128';"
          $proxyLines += "  h['referer'] = 'http://localhost:20128/';"
          $proxyLines += "  h['sec-fetch-site'] = 'same-origin';"
          $proxyLines += "  const opts = { hostname: '127.0.0.1', port: 20128, path: req.url, method: req.method, headers: h };"
          $proxyLines += "  const proxyReq = http.request(opts, (proxyRes) => {"
          $proxyLines += "    res.writeHead(proxyRes.statusCode, proxyRes.headers);"
          $proxyLines += "    proxyRes.pipe(res, { end: true });"
          $proxyLines += "  });"
          $proxyLines += "  req.pipe(proxyReq, { end: true });"
          $proxyLines += "  proxyReq.on('error', () => { res.writeHead(502); res.end('proxy error'); });"
          $proxyLines += "});"
          $proxyLines += "server.listen(20129, '127.0.0.1', () => console.log('PROXY_READY'));"
          
          $proxyLines | Set-Content -Path "proxy.js" -Encoding UTF8
          Start-Process -FilePath "node" -ArgumentList "proxy.js" -WindowStyle Hidden
          Start-Sleep -Seconds 5
          Write-Host "Proxy started"

      - name: Restart 9router with No Auth
        run: |
          Write-Host "9router yeniden baslatiliyor (REQUIRE_API_KEY=false)..."
          Start-Process -FilePath "cmd.exe" -ArgumentList "/c", "set REQUIRE_API_KEY=false && 9router" -WindowStyle Hidden
          Start-Sleep -Seconds 30
          
          $healthy = $false
          for ($i = 1; $i -le 10; $i++) {
            try {
              $r = Invoke-RestMethod -Uri "http://127.0.0.1:20128/api/health" -Method GET -TimeoutSec 3
              $healthy = $true
              break
            } catch {
              Start-Sleep -Seconds 3
            }
          }
          
          if ($healthy) {
            Write-Host "9router healthy"
          } else {
            Write-Host "9router health check failed, continuing anyway"
          }

      - name: Create Cloudflare Tunnel
        run: |
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "cloudflared.exe"
          
          $outLog = "cf-out.log"
          $errLog = "cf-err.log"
          
          Start-Process -NoNewWindow -FilePath ".\cloudflared.exe" -ArgumentList "tunnel", "--url", "http://127.0.0.1:20129" -RedirectStandardOutput $outLog -RedirectStandardError $errLog
          
          $tunnelUrl = ""
          for ($i = 1; $i -le 60; $i++) {
            Start-Sleep -Seconds 3
            $content = ""
            if (Test-Path $outLog) { $content += Get-Content $outLog -Raw -ErrorAction SilentlyContinue }
            if (Test-Path $errLog) { $content += Get-Content $errLog -Raw -ErrorAction SilentlyContinue }
            if ($content -match 'https://[a-zA-Z0-9-]+\.(trycloudflare\.com|cfargotunnel\.com)') {
              $tunnelUrl = $matches[0]
              break
            }
            Write-Host "Tunnel URL bekleniyor... ($i/60)"
          }
          
          if ($tunnelUrl) {
            Write-Host ""
            Write-Host "============================================"
            Write-Host "9ROUTER TUNNEL HAZIR (BULLETPROOF)"
            Write-Host "============================================"
            Write-Host "TUNNEL URL  : $tunnelUrl"
            Write-Host "9ROUTER API : $tunnelUrl/v1"
            Write-Host "API KEY     : Gerekli DEĞİL (otomatik kapatıldı)"
            Write-Host "RDP USER    : runneradmin"
            Write-Host "RDP PASS    : P@ssw0rd123!"
            Write-Host "============================================"
            Write-Host "Dashboard: $tunnelUrl/dashboard"
          } else {
            Write-Host "Tunnel URL alinamadi!"
            if (Test-Path $errLog) { Get-Content $errLog }
            exit 1
          }
          
          while ($true) {
            Start-Sleep -Seconds 60
            Write-Host "Aktif - $(Get-Date -Format 'HH:mm:ss')"
          }
