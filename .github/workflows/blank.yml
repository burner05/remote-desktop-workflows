name: WINDOWS RDP - 9ROUTER TUNNEL (BULLETPROOF)

on:
  workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Enable Windows RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
          Write-Host "RDP Enabled"

      - name: Set Password
        run: |
          $securePassword = ConvertTo-SecureString -AsPlainText "P@ssw0rd123!" -Force
          Set-LocalUser -Name "runneradmin" -Password $securePassword
          Write-Host "Password set"

      - name: Set Turkish Q Keyboard
        run: |
          $LangList = New-WinUserLanguageList tr-TR
          $LangList[0].InputMethodTips.Clear()
          $LangList[0].InputMethodTips.Add("041F:0000041F")
          Set-WinUserLanguageList -LanguageList $LangList -Force
          Set-WinSystemLocale -SystemLocale tr-TR
          Set-Culture -CultureInfo tr-TR
          Write-Host "Turkish Q keyboard set"

      - name: Install 9router
        run: |
          npm install -g 9router
          Write-Host "9router installed"

      - name: Start 9router First Time
        run: |
          Write-Host "9router baslatiliyor (veritabani olusturulacak)..."
          Start-Process -FilePath "cmd.exe" -ArgumentList "/c", "set REQUIRE_API_KEY=false && 9router" -WindowStyle Hidden
          Start-Sleep -Seconds 20
          Write-Host "Veritabani olusturuldu"

      - name: Stop 9router and Find Database
        run: |
          Write-Host "9router durduruluyor..."
          Stop-Process -Name "node" -Force -ErrorAction SilentlyContinue
          Stop-Process -Name "9router" -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          Write-Host "9router durduruldu"

      - name: Disable Require API Key via Database
        run: |
          Write-Host "Veritabani bulunuyor ve manipule ediliyor..."
          
          $dbPaths = @(
            "$env:USERPROFILE\.9router\data.db",
            "$env:USERPROFILE\.9router\settings.db",
            "$env:USERPROFILE\.9router\config.db",
            "$env:APPDATA\9router\data.db",
            "$env:LOCALAPPDATA\9router\data.db"
          )
          
          $dbPath = $null
          foreach ($path in $dbPaths) {
            if (Test-Path $path) {
              $dbPath = $path
              Write-Host "Veritabani bulundu: $dbPath"
              break
            }
          }
          
          if (-not $dbPath) {
            Write-Host "Veritabani bulunamadi! Tum 9router dizinleri aranıyor..."
            Get-ChildItem -Path "$env:USERPROFILE" -Recurse -Filter "*.db" -ErrorAction SilentlyContinue | Where-Object { $_.DirectoryName -like "*9router*" } | ForEach-Object {
              Write-Host "Potansiyel DB bulundu: $($_.FullName)"
              if (-not $dbPath) { $dbPath = $_.FullName }
            }
          }
          
          if ($dbPath) {
            Write-Host "Python ile veritabani guncelleniyor..."
            
            $pythonScript = @"
import sqlite3
import sys
import os

db_path = r'$dbPath'
print(f"Veritabani aciliyor: {db_path}")

conn = sqlite3.connect(db_path)
cursor = conn.cursor()

# Tum tablolari listele
cursor.execute("SELECT name FROM sqlite_master WHERE type='table';")
tables = cursor.fetchall()
print(f"Tablolar: {[t[0] for t in tables]}")

# Her tabloyu tara ve requireApiKey'i bul
for table in tables:
    table_name = table[0]
    try:
        cursor.execute(f"PRAGMA table_info('{table_name}');")
        columns = cursor.fetchall()
        print(f"Tablo '{table_name}' kolonlari: {[c[1] for c in columns]}")
        
        # key-value formatinda mi kontrol et
        cursor.execute(f"SELECT * FROM {table_name} LIMIT 1;")
        sample = cursor.fetchall()
        print(f"Tablo '{table_name}' ornek veri: {sample}")
        
        # requireApiKey ara
        if len(columns) >= 2:
            for col in columns:
                if 'key' in col[1].lower() or 'name' in col[1].lower():
                    key_col = col[1]
                    # value kolonunu bul
                    val_col = None
                    for c in columns:
                        if 'value' in c[1].lower() or 'val' in c[1].lower() or 'data' in c[1].lower():
                            val_col = c[1]
                            break
                    
                    if val_col:
                        print(f"Araniyor: {table_name}.{key_col} = 'requireApiKey'")
                        cursor.execute(f"UPDATE {table_name} SET {val_col} = 'false', {val_col} = '0', {val_col} = 0 WHERE LOWER({key_col}) = 'requireapikey' OR LOWER({key_col}) = 'require_api_key';")
                        print(f"Guncellenen satir sayisi: {cursor.rowcount}")
    except Exception as e:
        print(f"Tablo '{table_name}' islenemedi: {e}")

conn.commit()
conn.close()
print("VERITABANI_GUNCELLENDI")
"@
            
            Set-Content -Path "update_db.py" -Value $pythonScript -Encoding UTF8
            python update_db.py
            
            Write-Host "Veritabani guncellemesi tamamlandi"
          } else {
            Write-Host "HIC VERITABANI BULUNAMADI! Fallback yontem deneniyor..."
            
            # Fallback: 9router'in config dosyasini manipule et
            $configPaths = @(
              "$env:USERPROFILE\.9router\config.json",
              "$env:USERPROFILE\.9router\settings.json",
              "$env:APPDATA\9router\config.json"
            )
            
            foreach ($path in $configPaths) {
              if (Test-Path $path) {
                Write-Host "Config dosyasi bulundu: $path"
                $content = Get-Content $path -Raw | ConvertFrom-Json
                $content.requireApiKey = $false
                $content | ConvertTo-Json | Set-Content $path -Encoding UTF8
                Write-Host "Config dosyasi guncellendi"
                break
              }
            }
          }

      - name: Create Loopback Proxy
        run: |
          Write-Host "Loopback proxy olusturuluyor..."
          
          $proxyCode = "const http = require('http');"
          $proxyCode += "const server = http.createServer((req, res) => {"
          $proxyCode += "  const h = { ...req.headers };"
          $proxyCode += "  const removeHeaders = ['cf-connecting-ip', 'cf-ipcountry', 'cf-ray', 'cf-visitor', 'cf-worker', 'cf-colo', 'x-forwarded-for', 'x-forwarded-proto', 'x-forwarded-host', 'x-forwarded-server', 'x-forwarded-port', 'x-real-ip', 'forwarded', 'true-client-ip', 'x-original-forwarded-for', 'x-client-ip', 'x-cluster-client-ip', 'via'];"
          $proxyCode += "  for (const k of removeHeaders) { delete h[k]; }"
          $proxyCode += "  h['host'] = 'localhost:20128';"
          $proxyCode += "  h['origin'] = 'http://localhost:20128';"
          $proxyCode += "  h['referer'] = 'http://localhost:20128/';"
          $proxyCode += "  const opts = { hostname: '127.0.0.1', port: 20128, path: req.url, method: req.method, headers: h };"
          $proxyCode += "  const proxyReq = http.request(opts, (proxyRes) => {"
          $proxyCode += "    res.writeHead(proxyRes.statusCode, proxyRes.headers);"
          $proxyCode += "    proxyRes.pipe(res, { end: true });"
          $proxyCode += "  });"
          $proxyCode += "  req.pipe(proxyReq, { end: true });"
          $proxyCode += "  proxyReq.on('error', () => { res.writeHead(502); res.end('proxy error'); });"
          $proxyCode += "});"
          $proxyCode += "server.listen(20129, '127.0.0.1', () => { console.log('PROXY_READY'); });"
          
          Set-Content -Path "proxy.js" -Value $proxyCode -Encoding UTF8
          Start-Process -FilePath "node" -ArgumentList "proxy.js" -WindowStyle Hidden
          Start-Sleep -Seconds 5
          
          Write-Host "Proxy hazir"

      - name: Restart 9router
        run: |
          Write-Host "9router yeniden baslatiliyor..."
          Start-Process -FilePath "cmd.exe" -ArgumentList "/c", "set REQUIRE_API_KEY=false && 9router" -WindowStyle Hidden
          Start-Sleep -Seconds 20
          
          try {
            $response = Invoke-RestMethod -Uri "http://127.0.0.1:20128/api/health" -Method GET -TimeoutSec 5
            Write-Host "9router yeniden baslatildi ve calisiyor"
            
            # requireApiKey ayarini kontrol et
            try {
              $config = Invoke-RestMethod -Uri "http://127.0.0.1:20129/api/settings" -Method GET -TimeoutSec 5
              Write-Host "Mevcut ayarlar: $($config | ConvertTo-Json)"
            } catch {
              Write-Host "Ayarlar kontrol edilemedi (bu normal olabilir)"
            }
          } catch {
            Write-Host "9router health check basarisiz ama devam ediliyor..."
          }

      - name: Create Cloudflare Tunnel
        run: |
          Write-Host "Cloudflared indiriliyor..."
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "cloudflared.exe"
          
          $outLog = "cf-out.log"
          $errLog = "cf-err.log"
          
          Write-Host "Tunnel baslatiliyor (proxy:20129)..."
          Start-Process -NoNewWindow -FilePath ".\cloudflared.exe" -ArgumentList "tunnel", "--url", "http://127.0.0.1:20129" -RedirectStandardOutput $outLog -RedirectStandardError $errLog
          
          $tunnelUrl = ""
          for ($i = 1; $i -le 50; $i++) {
            Start-Sleep -Seconds 3
            $content = ""
            if (Test-Path $outLog) { $content += Get-Content $outLog -Raw -ErrorAction SilentlyContinue }
            if (Test-Path $errLog) { $content += Get-Content $errLog -Raw -ErrorAction SilentlyContinue }
            if ($content -match 'https://[a-zA-Z0-9-]+\.(trycloudflare\.com|cfargotunnel\.com)') {
              $tunnelUrl = $matches[0]
              break
            }
            Write-Host "Tunnel URL bekleniyor... ($i/50)"
          }
          
          if ($tunnelUrl) {
            Write-Host ""
            Write-Host "============================================"
            Write-Host "9ROUTER TUNNEL HAZIR!"
            Write-Host "============================================"
            Write-Host "TUNNEL URL  : $tunnelUrl"
            Write-Host "9ROUTER API : $tunnelUrl/v1"
            Write-Host "API KEY     : Gerekli degil (veritabani manipule edildi)"
            Write-Host "RDP USER    : runneradmin"
            Write-Host "RDP PASS    : P@ssw0rd123!"
            Write-Host "============================================"
            Write-Host ""
            Write-Host "Dashboard'a erismek icin:"
            Write-Host "$tunnelUrl/dashboard"
            Write-Host ""
            Write-Host "Eger hala API key istiyorsa, dashboard'dan manuel olarak kapatip tekrar deneyin."
          } else {
            Write-Host "Tunnel URL alinamadi!"
            if (Test-Path $errLog) { Get-Content $errLog }
            exit 1
          }
          
          while ($true) {
            Start-Sleep -Seconds 60
            Write-Host "Aktif - $(Get-Date -Format 'HH:mm:ss')"
          }
