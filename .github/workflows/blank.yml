name: WINDOWS RDP - 9ROUTER TUNNEL

on:
  workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Node 20 uyarılarını önlemek için stabil Node 22

      - name: Enable Windows RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
          Write-Host "✅ RDP Enabled"

      - name: Set Password
        run: |
          $securePassword = ConvertTo-SecureString -AsPlainText "P@ssw0rd123!" -Force
          Set-LocalUser -Name "runneradmin" -Password $securePassword
          Write-Host "✅ Password set to: P@ssw0rd123!"

      - name: Set Turkish Q Keyboard
        run: |
          Write-Host "Türkçe Q klavye ayarlanıyor..."
          $LangList = New-WinUserLanguageList tr-TR
          $LangList[0].InputMethodTips.Clear()
          $LangList[0].InputMethodTips.Add("041F:0000041F")
          Set-WinUserLanguageList -LanguageList $LangList -Force
          Set-WinSystemLocale -SystemLocale tr-TR
          Set-Culture -CultureInfo tr-TR
          Write-Host "✅ Türkçe Q klavye ayarlandı"

      - name: Install and Start 9router (No Auth)
        run: |
          Write-Host "9router indiriliyor ve kuruluyor..."
          npm install -g 9router
          
          Write-Host "9router başlatılıyor (API Key zorunluluğu devre dışı bırakılıyor)..."
          # PowerShell ile süreci REQUIRE_API_KEY=false ortam değişkeniyle başlatıyoruz
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = "9router"
          $psi.UseShellExecute = $false
          $psi.CreateNoWindow = $true
          $psi.EnvironmentVariables["REQUIRE_API_KEY"] = "false"
          [System.Diagnostics.Process]::Start($psi) | Out-Null
          
          Write-Host "9router'ın başlaması bekleniyor (20 saniye)..."
          Start-Sleep -Seconds 20
          
          try {
            $response = Invoke-RestMethod -Uri "http://localhost:20128/api/health" -Method GET -TimeoutSec 5
            Write-Host "✅ 9router başarıyla başlatıldı ve çalışıyor."
          } catch {
            Write-Host "⚠️ 9router health check başarısız, ancak süreç başlatıldı."
          }

      - name: Create Cloudflare Tunnel for 9router
        run: |
          Write-Host "============================================"
          Write-Host "🚀 9ROUTER İÇİN CLOUDFLARE TUNNEL OLUŞTURULUYOR"
          Write-Host "============================================"
          
          # Cloudflared'ı indir
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "cloudflared.exe"
          
          $outLog = "cloudflared-out.log"
          $errLog = "cloudflared-err.log"
          
          Write-Host "Tunnel başlatılıyor (localhost:20128)..."
          Start-Process -NoNewWindow -FilePath ".\cloudflared.exe" `
            -ArgumentList "tunnel --url http://localhost:20128" `
            -RedirectStandardOutput $outLog `
            -RedirectStandardError $errLog
          
          $tunnelUrl = ""
          for ($i = 1; $i -le 40; $i++) {
            Start-Sleep -Seconds 3
            
            $content = ""
            if (Test-Path $outLog) { $content += Get-Content $outLog -Raw -ErrorAction SilentlyContinue }
            if (Test-Path $errLog) { $content += Get-Content $errLog -Raw -ErrorAction SilentlyContinue }
            
            # trycloudflare.com veya cfargotunnel.com formatını yakala
            if ($content -match 'https://[a-zA-Z0-9-]+\.(trycloudflare\.com|cfargotunnel\.com)') {
              $tunnelUrl = $matches[0]
              break
            }
            Write-Host "Tunnel URL bekleniyor... ($i/40)"
          }
          
          if ($tunnelUrl) {
            Write-Host ""
            Write-Host "============================================"
            Write-Host "✅ 9ROUTER TUNNEL HAZIR!"
            Write-Host "============================================"
            Write-Host "TUNNEL URL : $tunnelUrl"
            Write-Host "9ROUTER API: $tunnelUrl/v1"
            Write-Host "API KEY    : Gerekli değil (REQUIRE_API_KEY=false)"
            Write-Host "RDP USER   : runneradmin"
            Write-Host "RDP PASS   : P@ssw0rd123!"
            Write-Host "============================================"
            Write-Host ""
            Write-Host "Not: 9router, REQUIRE_API_KEY=false ortam değişkeni ile başlatıldığı için"
            Write-Host "herhangi bir API key girmenize gerek kalmadan doğrudan bağlantı kurabilirsiniz."
          } else {
            Write-Host "❌ Tunnel URL alınamadı. Loglar:"
            if (Test-Path $outLog) { Write-Host "--- OUT ---"; Get-Content $outLog }
            if (Test-Path $errLog) { Write-Host "--- ERR ---"; Get-Content $errLog }
            exit 1
          }
          
          while ($true) {
            Start-Sleep -Seconds 60
            Write-Host "✓ Sistem Aktif - $(Get-Date -Format 'HH:mm:ss')"
          }
