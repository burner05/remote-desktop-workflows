name: OPENCE WEB - CLOUDFLARE TUNNEL

on:
  workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install opencode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$HOME/.opencode/bin:$PATH"
          # Fallback: locate binary and symlink if not on PATH
          if ! command -v opencode >/dev/null 2>&1; then
            BIN=$(find "$HOME/.opencode" /usr/local /opt -name opencode -type f 2>/dev/null | head -n1)
            if [ -n "$BIN" ]; then
              ln -sf "$BIN" "$HOME/.opencode/bin/opencode" 2>/dev/null || true
            fi
          fi
          command -v opencode || ls -la "$HOME/.opencode/bin" || true
          opencode --version || true

      - name: Prepare project folder + yolo permissions
        run: |
          mkdir -p /home/runner/workspace
          mkdir -p "$HOME/.config/opencode"
          cat > "$HOME/.config/opencode/opencode.json" <<'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "permission": {
              "*": "allow",
              "bash": "allow",
              "edit": "allow",
              "write": "allow",
              "read": "allow",
              "glob": "allow",
              "grep": "allow",
              "webfetch": "allow",
              "websearch": "allow",
              "task": "allow",
              "skill": "allow",
              "lsp": "allow",
              "question": "allow",
              "external_directory": "allow",
              "doom_loop": "allow"
            }
          }
          EOF
          echo "Project folder ready: /home/runner/workspace"
          echo "YOLO permissions written to $HOME/.config/opencode/opencode.json"

      - name: Start opencode web
        run: |
          export PATH="$HOME/.local/bin:$HOME/.opencode/bin:$PATH"
          export OPENCODE_YOLO=true
          echo "opencode binary: $(command -v opencode)"
          opencode --version || true
          cd /home/runner/workspace
          nohup opencode web --port 4096 --hostname 0.0.0.0 > opencode.log 2>&1 &
          echo "opencode web launched (pid $!)"
          sleep 10
          echo "=== opencode.log (early, after 10s) ==="
          cat opencode.log
          if ! timeout 3 bash -c '</dev/tcp/127.0.0.1/4096' 2>/dev/null; then
            echo "Port not yet listening after 10s; continuing to wait..."
          fi
          up=0
          for i in $(seq 1 60); do
            if timeout 3 bash -c '</dev/tcp/127.0.0.1/4096' 2>/dev/null; then
              echo "opencode web is UP on port 4096 (try $i)"
              up=1
              break
            fi
            sleep 2
          done
          echo "=== opencode.log (final) ==="
          cat opencode.log
          if [ "$up" != "1" ]; then
            echo "WARN: port 4096 not listening within timeout; printing process state:"
            ps aux | grep -i opencode | grep -v grep || true
          fi

      - name: Create Tunnel
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          ./cloudflared tunnel --url http://127.0.0.1:4096 > cf.log 2>&1 &

          tunnelUrl=""
          for i in $(seq 1 60); do
            sleep 3
            url=$(grep -oE "https://[a-zA-Z0-9.-]+\.trycloudflare\.com" cf.log | head -n1)
            if [ -n "$url" ]; then
              tunnelUrl="$url"
              break
            fi
            echo "Waiting for tunnel... ($i/60)"
          done

          if [ -z "$tunnelUrl" ]; then
            echo "TUNNEL FAILED"
            cat cf.log
            exit 1
          fi

          echo ""
          echo "============================================"
          echo "OPENCE WEB TUNNEL READY"
          echo "============================================"
          echo "TUNNEL URL     : ${tunnelUrl}?directory=/home/runner/workspace"
          echo "OPENCE WEB     : ${tunnelUrl}?directory=/home/runner/workspace"
          echo "LOCAL (runner) : http://localhost:4096"
          echo "PROJECT FOLDER : /home/runner/workspace"
          echo "AUTH           : NONE (unsecured)"
          echo "YOLO           : permissions=allow (config) + OPENCODE_YOLO=true"
          echo "============================================"

          while true; do
            sleep 60
            echo "Alive - $(date -u +'%H:%M:%S UTC')"
          done
