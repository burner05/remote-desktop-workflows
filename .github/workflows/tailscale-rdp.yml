name: TEMP VPN - TAILSCALE
on:
  workflow_dispatch

jobs:
  vpn:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey=${{ secrets.TS_AUTHKEY }} --hostname=github-vpn --accept-routes --advertise-exit-node
          echo "✅ Tailscale bağlandı"

      - name: Show Connection Info
        run: |
          echo "============================================"
          echo "✅ VPN HAZIR"
          echo "============================================"
          echo "Hostname : $(hostname)"
          echo "Tailscale IP:"
          tailscale ip -4
          tailscale ip -6
          echo ""
          echo "Status:"
          tailscale status
          echo "============================================"

      - name: Keep Alive
        run: |
          while true; do
            echo "✓ Aktif - $(date '+%H:%M:%S')"
            sleep 60
          done
