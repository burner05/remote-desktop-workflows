name: SIMPLE SOCKS PROXY
on:
  workflow_dispatch

jobs:
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y microsocks curl
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          microsocks -p 1080 &
          sleep 1
          echo "✅ hazır"

      - name: Tunnel
        run: |
          cloudflared tunnel --url tcp://localhost:1080 2>&1 | tee tunnel.log &
          
          for i in {1..40}; do
            sleep 3
            URL=$(grep -oE '[a-z0-9-]+\.trycloudflare\.com' tunnel.log | head -1)
            if [ -n "$URL" ]; then
              echo ""
              echo "============================================"
              echo "✅ HAZIR"
              echo "============================================"
              echo "Hostname : $URL"
              echo ""
              echo "Mac'te sadece şunu çalıştır:"
              echo "cloudflared access tcp --hostname $URL --url localhost:1080"
              echo ""
              echo "Sonra tarayıcıda SOCKS5 → 127.0.0.1:1080 ayarla"
              echo "============================================"
              break
            fi
            echo "Bekleniyor... ($i/40)"
          done
          
          while true; do sleep 60; echo "✓ Aktif"; done
