name: SIMPLE PROXY
on:
  workflow_dispatch

jobs:
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y tinyproxy curl
          
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          
          echo "Port 8888" | sudo tee /etc/tinyproxy/tinyproxy.conf
          echo "Allow 127.0.0.1" | sudo tee -a /etc/tinyproxy/tinyproxy.conf
          sudo tinyproxy -c /etc/tinyproxy/tinyproxy.conf &
          sleep 2
          echo "✅ Kurulum tamam"

      - name: Start Tunnel
        run: |
          cloudflared tunnel --url http://localhost:8888 2>&1 | tee tunnel.log &
          
          echo "URL bekleniyor..."
          for i in {1..40}; do
            sleep 3
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' tunnel.log | head -1)
            if [ -n "$URL" ]; then
              echo ""
              echo "============================================"
              echo "✅ HAZIR"
              echo "============================================"
              echo "Proxy Adresi : $URL"
              echo ""
              echo "Kullanım:"
              echo "1. Tarayıcıya SwitchyOmega veya FoxyProxy kur"
              echo "2. HTTP Proxy → Adres: $URL   Port: 443"
              echo "3. Aktif et"
              echo "============================================"
              break
            fi
            echo "Bekleniyor... ($i/40)"
          done
          
          if [ -z "$URL" ]; then
            echo "❌ URL alınamadı. Log:"
            cat tunnel.log
            exit 1
          fi
          
          while true; do
            echo "✓ Aktif - $(date '+%H:%M:%S')"
            sleep 60
          done
