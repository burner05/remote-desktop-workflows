name: WINDOWS RDP - CLOUDFLARE + ADSPOWER
on:
  workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Setup Cloudflared
        uses: AnimMouse/setup-cloudflared@v2

      - name: Enable Windows RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
          Write-Host "✅ RDP Enabled"

      - name: Set Password
        run: |
          Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "P@ssw0rd123!" -Force)
          Write-Host "✅ Password set"

      - name: Set Turkish Q Keyboard
        run: |
          Write-Host "Türkçe Q klavye ayarlanıyor..."
          
          # Dil ve klavye listesini oluştur
          $LangList = New-WinUserLanguageList tr-TR
          $LangList[0].InputMethodTips.Clear()
          $LangList[0].InputMethodTips.Add("041F:0000041F")   # Türkçe Q
          
          Set-WinUserLanguageList -LanguageList $LangList -Force
          
          # Sistem yerel ayarını da Türkçe yap
          Set-WinSystemLocale -SystemLocale tr-TR
          Set-Culture -CultureInfo tr-TR
          
          Write-Host "✅ Türkçe Q klavye ayarlandı"

      - name: Download & Install AdsPower
        run: |
          Write-Host "AdsPower indiriliyor..."
          Invoke-WebRequest -Uri "https://version.adspower.net/software/win64-global/8.7.23/AdsPower-Global-8.7.23-x64.exe" -OutFile "AdsPowerSetup.exe"
          
          Write-Host "Kurulum başlatılıyor..."
          Start-Process -FilePath "AdsPowerSetup.exe" -ArgumentList "/S" -Wait -NoNewWindow
          
          Write-Host "✅ AdsPower kuruldu"

      - name: Start Tunnel + Print URL
        run: |
          Write-Host "============================================"
          Write-Host "🚀 CLOUDFLARE TUNNEL BAŞLATILIYOR"
          Write-Host "============================================"
          
          $outLog = "cloudflared-out.log"
          $errLog = "cloudflared-err.log"
          
          Start-Process -NoNewWindow -FilePath "cloudflared" `
            -ArgumentList "tunnel --url tcp://localhost:3389" `
            -RedirectStandardOutput $outLog `
            -RedirectStandardError $errLog
          
          $url = $null
          for ($i = 1; $i -le 40; $i++) {
            Start-Sleep -Seconds 3
            
            $content = ""
            if (Test-Path $outLog) { $content += Get-Content $outLog -Raw -ErrorAction SilentlyContinue }
            if (Test-Path $errLog) { $content += Get-Content $errLog -Raw -ErrorAction SilentlyContinue }
            
            if ($content -match 'https://([a-z0-9-]+\.trycloudflare\.com)') {
              $url = $matches[1]
              break
            }
            Write-Host "URL bekleniyor... ($i/40)"
          }
          
          if ($url) {
            Write-Host ""
            Write-Host "============================================"
            Write-Host "✅ TUNNEL AÇILDI!"
            Write-Host "============================================"
            Write-Host "HOSTNAME : $url"
            Write-Host "USERNAME : runneradmin"
            Write-Host "PASSWORD : P@ssw0rd123!"
            Write-Host "============================================"
            Write-Host ""
            Write-Host "Mac'te şu komutu çalıştır:"
            Write-Host "cloudflared access tcp --hostname $url --url localhost:3389"
            Write-Host ""
          } else {
            Write-Host "❌ URL alınamadı. Loglar:"
            if (Test-Path $outLog) { Write-Host "--- OUT ---"; Get-Content $outLog }
            if (Test-Path $errLog) { Write-Host "--- ERR ---"; Get-Content $errLog }
            exit 1
          }
          
          while ($true) {
            Start-Sleep -Seconds 60
            Write-Host "✓ Aktif - $(Get-Date -Format 'HH:mm:ss')"
          }
