name: WINDOWS RDP - CLOUDFLARE
on:
  workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Setup Cloudflared
        uses: AnimMouse/setup-cloudflared@v2

      - name: Enable Windows RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
          Write-Host "✅ RDP Enabled"

      - name: Set Password
        run: |
          Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "P@ssw0rd123!" -Force)
          Write-Host "✅ Password set"

      - name: Start Cloudflare Tunnel and Print URL
        run: |
          Write-Host "============================================"
          Write-Host "🚀 CLOUDFLARE TUNNEL BAŞLATILIYOR"
          Write-Host "============================================"
          
          # Tunnel'i arka planda başlat ve log'u yakala
          $job = Start-Job -ScriptBlock {
            cloudflared tunnel --url tcp://localhost:3389 2>&1
          }
          
          # URL'yi bekle (max 60 saniye)
          $url = $null
          for ($i = 1; $i -le 30; $i++) {
            Start-Sleep -Seconds 2
            $output = Receive-Job $job
            if ($output -match 'https://([a-z0-9-]+\.trycloudflare\.com)') {
              $url = $matches[1]
              break
            }
            Write-Host "URL bekleniyor... ($i/30)"
          }
          
          if ($url) {
            Write-Host ""
            Write-Host "============================================"
            Write-Host "✅ TUNNEL AÇILDI!"
            Write-Host "============================================"
            Write-Host "HOSTNAME: $url"
            Write-Host "USERNAME: administrator"
            Write-Host "PASSWORD: Ananinami123@!"
            Write-Host "============================================"
            Write-Host ""
            Write-Host "Mac'te şu komutu çalıştır:"
            Write-Host "cloudflared access tcp --hostname $url --url localhost:3389"
          } else {
            Write-Host "❌ URL alınamadı. Log'a bak:"
            Receive-Job $job
          }
          
          # Job'u canlı tut
          while ($true) {
            Start-Sleep -Seconds 60
            Write-Host "✓ Aktif - $(Get-Date -Format 'HH:mm:ss')"
          }
